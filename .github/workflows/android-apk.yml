name: Build Android APK

on:
  push:
    branches: [main, master, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: android
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Collect APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Staymark.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Staymark-apk
          path: Staymark.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Staymark v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: Staymark.apk
          body: |
            📱 **Download `Staymark.apk` below and open it on your Android phone to install.**

            If Android asks, allow "Install unknown apps" for your browser or Files app.
            Built from ${{ github.sha }}.
